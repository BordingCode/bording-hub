<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bording Hub</title>
  <meta name="description" content="Alle Mathias' hobbyprojekter — spil, apps &amp; oplevelser — samlet ét sted." />
  <meta name="theme-color" content="#05030f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305030f'/%3E%3Cpath d='M16 5l2.8 6.8L26 13l-5.4 4.2L22 25l-6-3.6L10 25l1.4-7.8L6 13l7.2-1.2z' fill='%2334f5ff'/%3E%3C/svg%3E" />
  <!-- installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bording Hub" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05030f; --ink: #eaf2ff; --muted: #9aa6d6;
      --cyan: #34f5ff; --violet: #9d6bff; --magenta: #ff4d9d; --gold: #ffd166; --green: #5dffb0;
      --panel: rgba(255,255,255,.04); --edge: rgba(255,255,255,.10);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      font-family: 'Rajdhani', system-ui, sans-serif;
      color: var(--ink); background: var(--bg);
      min-height: 100svh;
      padding: calc(env(safe-area-inset-top) + 36px) 20px calc(env(safe-area-inset-bottom) + 48px);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(40,28,90,.55), rgba(5,3,15,.96) 70%),
        var(--bg);
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    .logo {
      font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: .12em;
      font-size: clamp(30px, 9vw, 52px); line-height: 1;
      background: linear-gradient(180deg, #c9f6ff 0%, var(--cyan) 42%, var(--violet) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 22px rgba(52,245,255,.4));
    }
    .tag { color: var(--muted); letter-spacing: .26em; text-transform: uppercase; font-size: 12px; margin-top: 8px; }
    .section-title { font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; color: var(--cyan); margin: 30px 4px 14px; display: flex; align-items: center; gap: 12px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }
    .section-title:first-of-type { margin-top: 6px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card {
      display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit;
      padding: 16px 18px; border-radius: 18px;
      background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge);
      transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
    }
    .card:active { transform: scale(.97); }
    .card:hover { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--c, var(--cyan)), 0 0 26px -6px var(--c, var(--cyan)); }
    .ic {
      flex: 0 0 auto; width: 52px; height: 52px; border-radius: 14px; color: var(--c, var(--cyan));
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), rgba(255,255,255,.02));
      box-shadow: inset 0 0 0 1px var(--edge), 0 0 18px -5px var(--c, var(--cyan));
    }
    .ic svg { width: 26px; height: 26px; }
    .body { min-width: 0; }
    .name { display: block; font-family: 'Rajdhani', system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .01em; color: var(--ink); }
    .desc { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 3px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 34px; letter-spacing: .04em; }
    .arrow { margin-left: auto; color: var(--muted); font-size: 20px; flex: 0 0 auto; }
    .section-block:first-child .section-title { margin-top: 6px; }

    /* active / passive controls */
    .controls { display: flex; justify-content: center; gap: 10px; margin: -4px 0 24px; flex-wrap: wrap; }
    .ctrl { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .05em;
      color: var(--muted); background: var(--panel); border: 1px solid var(--edge); border-radius: 999px;
      padding: 9px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: .15s; }
    .ctrl:hover { color: var(--ink); border-color: var(--cyan); }
    .ctrl.on { color: #05030f; background: var(--cyan); border-color: var(--cyan); }
    .edit-hint { text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: -14px 0 20px; }
    .edit-hint b { color: var(--cyan); font-weight: 700; }
    .statusbtn { margin-left: auto; flex: 0 0 auto; font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px;
      padding: 8px 14px; border: 1px solid var(--edge); background: rgba(255,255,255,.05); color: var(--muted); cursor: pointer; }
    .statusbtn.is-active { color: var(--green); border-color: rgba(93,255,176,.45); }
    .card.passive { opacity: .5; }
    body.editing .card { cursor: default; }
    body.editing .card.passive { opacity: .62; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">BORDING<br>HUB</div>
      <div class="tag">spil, apps &amp; oplevelser &middot; samlet ét sted</div>
    </header>
    <div class="controls" id="controls"></div>
    <div class="edit-hint" id="edit-hint" hidden>Tryk <b>Aktiv / Passiv</b> på hvert projekt for at vælge, hvad der vises på forsiden.</div>
    <div id="sections"></div>
    <footer>Lavet af Bording &middot; <span id="count"></span> projekter</footer>
  </div>
  <script>
    // Inline line-icons (stroke = currentColor) — render identically everywhere, no emoji/icon-font needed.
    const ICONS = {
      atom:'<circle cx="12" cy="12" r="2.2"/><ellipse cx="12" cy="12" rx="10" ry="4.4"/><ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(120 12 12)"/>',
      flame:'<path d="M12 21a6 6 0 0 0 6-6c0-4-4-6-4.5-10C11 7 11 9 9.5 10.5 8.7 9.8 8.5 8.6 8.5 7.6 6.8 9 6 11.5 6 15a6 6 0 0 0 6 6z"/>',
      banner:'<path d="M6 21V4M6 5h12l-3 4 3 4H6"/>',
      anchor:'<circle cx="12" cy="5" r="2.4"/><path d="M12 7.4V21M5 13a7 7 0 0 0 14 0M4 13h3M17 13h3"/>',
      cube:'<path d="M12 2.6l8.4 4.8v9.2L12 21.4 3.6 16.6V7.4z"/><path d="M12 21.4v-9.2M12 12.2l8.4-4.8M12 12.2L3.6 7.4"/>',
      star:'<path d="M12 3l2.5 6 6.5.5-5 4.2 1.6 6.3L12 16.9l-5.6 3.1 1.6-6.3-5-4.2 6.5-.5z"/>',
      shield:'<path d="M12 3l7 3v5.5c0 4.3-3 7.6-7 9-4-1.4-7-4.7-7-9V6z"/>',
      cards:'<rect x="4.5" y="6" width="10" height="14" rx="2"/><path d="M8.5 6V4h9a2 2 0 0 1 2 2v12h-2"/>',
      skull:'<path d="M5 11a7 7 0 1 1 14 0v2.6l-1.5 1V18a1 1 0 0 1-1 1H7.5a1 1 0 0 1-1-1v-3.4L5 13.6z"/><circle cx="9.2" cy="11.2" r="1.2"/><circle cx="14.8" cy="11.2" r="1.2"/>',
      dice:'<rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="8.6" cy="8.6" r="1.1"/><circle cx="15.4" cy="8.6" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="8.6" cy="15.4" r="1.1"/><circle cx="15.4" cy="15.4" r="1.1"/>',
      bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.8 10.7c.5.4.8 1 .8 1.6v.2h6v-.2c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/>',
      cutlery:'<path d="M7 3v6a2 2 0 0 0 4 0V3M9 9v12M16.5 3c-1.5 1-2 3-2 5s.5 3 2 3v10"/>',
      heart:'<path d="M12 20s-7-4.7-7-9.7A3.7 3.7 0 0 1 12 7a3.7 3.7 0 0 1 7 3.3C19 15.3 12 20 12 20z"/>',
      hand:'<path d="M8 12V5.6a1.5 1.5 0 0 1 3 0V11m0-.8V4a1.5 1.5 0 0 1 3 0v7m0-2.4a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6 6 6 0 0 1-5.2-3l-2-3.4a1.5 1.5 0 0 1 2.6-1.5L8 14"/>',
      yarn:'<circle cx="12" cy="12" r="8.5"/><path d="M5.6 9.5c4.2 2.1 8.6 2.1 12.8 0M4 13c5 2.9 11 2.9 16 0M9.5 4c-2.3 4.4-2.3 11.6 0 16M14.5 4c2.3 4.4 2.3 11.6 0 16"/>',
      headphones:'<path d="M5 13v-1a7 7 0 0 1 14 0v1M4.5 14.5a2 2 0 0 1 4 0v3a2 2 0 0 1-4 0zM19.5 14.5a2 2 0 0 0-4 0v3a2 2 0 0 0 4 0z"/>',
      crimp:'<path d="M7.5 6.5v6.5M11 5.5v7.5M14.5 5.5v7.5M18 6.5v6.5"/><path d="M5 14.5h15"/>',
      moon:'<path d="M20 13.6A8 8 0 1 1 10.4 4 6.2 6.2 0 0 0 20 13.6z"/>',
      gift:'<path d="M4.5 9.5h15V20a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1zM4 9.5h16M12 9.5V21M12 9.5C9.6 9.5 7.7 6.2 9 4.6 10.4 3 12 7.5 12 9.5c0-2 1.6-6.5 3-4.9 1.3 1.6-.6 4.9-3 4.9z"/>',
      disc:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r=".7" fill="currentColor"/>'
    };
    const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.star}</svg>`;

    // Each section has ONE accent colour. Edit lists to add/remove projects.
    const SECTIONS = [
      { title: 'Spil', accent: '#34f5ff', items: [
        { name: 'Primordia', icon: 'atom', desc: 'Kemi-puslespil — smed rigtige grundstoffer, bind molekyler, dyrk en død verden til liv.', url: 'https://bordingcode.github.io/primordia/' },
        { name: 'Emberlock', icon: 'flame', desc: 'Arena-brawler — skub rivaliserende troldmænd i lavaen før øen synker.', url: 'https://bordingcode.github.io/emberlock/' },
        { name: 'Warbound', icon: 'banner', desc: 'Fantasy auto-battler — saml din warband, byg synergier, se dem kæmpe.', url: 'https://bordingcode.github.io/warbound/' },
        { name: 'Saltforge', icon: 'anchor', desc: 'Tur-baseret frontier — udforsk tågen, byg din havn, sænk en skjult rival.', url: 'https://bordingcode.github.io/saltforge/' },
        { name: 'Saltforge 3D', icon: 'cube', desc: 'Førsteperson voxel-duel — grav efter ammo, scout tågen væk, og skyd fjendens fæstning i grus.', url: 'https://bordingcode.github.io/saltforge3d/' },
        { name: 'Starweaver', icon: 'star', desc: 'Roguelite bullet-hell — væv magi, undvig, knus sværmen.', url: 'https://bordingcode.github.io/starweaver/' },
        { name: 'Aegis', icon: 'shield', desc: 'Græsk-mytologisk tower-defense roguelite.', url: 'https://bordingcode.github.io/aegis/' },
        { name: 'Mournwood', icon: 'cards', desc: 'Mørkt deckbuilding-kortspil.', url: 'https://bordingcode.github.io/mournwood/' },
        { name: 'Mournwood (ny)', icon: 'skull', desc: 'Monster-jæger deckbuilder — 3 jægere × 5 pagter, nedstigning gennem 3 regioner med store bosser, plus en sværhedsgrads-stige og kodeks. Færdigt spil.', url: 'https://bordingcode.github.io/mournwood-remake/' },
        { name: 'Yatzy', icon: 'dice', desc: 'Den klassiske terningekamp, Bording-stil.', url: 'https://bordingcode.github.io/yatzy/' },
        { name: 'Hjernespil', icon: 'bulb', desc: 'Hyggelig samling hjernetræningsspil (Dorthe).', url: 'https://bordingcode.github.io/dorthe-braingames/' },
      ]},
      { title: 'Apps & oplevelser', accent: '#9d6bff', items: [
        { name: 'Dinder', icon: 'cutlery', desc: 'Swipe dig frem til din næste opskrift.', url: 'https://bordingcode.github.io/Dinder/' },
        { name: 'Babynavne', icon: 'heart', desc: 'Swipe & match babynavne sammen.', url: 'https://bordingcode.github.io/babynames/' },
        { name: 'Tegnspire', icon: 'hand', desc: 'Lær babytegn — forstå dit barn før det kan tale.', url: 'https://bordingcode.github.io/tegnspire/' },
        { name: 'Emmas Strik', icon: 'yarn', desc: 'Strikkehjælper — tællere, beregnere & håndplukkede opskrifter.', url: 'https://bordingcode.github.io/emma-strik/' },
        { name: 'Podwalk', icon: 'headphones', desc: 'Aarhus Music Walk — byvandring med kort, lyd & walk-mode.', url: 'https://bordingcode.github.io/podwalk2/' },
        { name: 'Hylden', icon: 'disc', desc: 'Din Spotify-musik som en hyggelig pladehylde — bladr i covers & find ud af, hvad du skal høre.', url: 'https://bordingcode.github.io/hylden/' },
        { name: 'Crimpedia', icon: 'crimp', desc: 'Klatrekonkurrencer, atleter & ranglister.', url: 'https://crimpedia.pages.dev/' },
        { name: 'Baby Sleep', icon: 'moon', desc: 'Guide til babysøvn.', url: 'https://bordingcode.github.io/baby-sleep/' },
        { name: 'Secret Santa', icon: 'gift', desc: 'Træk lod til pakkeleg.', url: 'https://bordingcode.github.io/secret-santa/' },
      ]},
    ];

    // ---- active / passive state (saved on this device) ----
    const LS = window.localStorage;
    let status = (() => { try { return JSON.parse(LS.getItem('bh_status') || '{}'); } catch (e) { return {}; } })();
    const saveStatus = () => { try { LS.setItem('bh_status', JSON.stringify(status)); } catch (e) {} };
    let showPassive = LS.getItem('bh_showpassive') === '1';
    let editing = false;
    const isPassive = (it) => status[it.url] === 'passive';
    const passiveCount = () => SECTIONS.reduce((n, s) => n + s.items.filter(isPassive).length, 0);

    const root = document.getElementById('sections');
    const controls = document.getElementById('controls');
    const editHint = document.getElementById('edit-hint');

    function render() {
      root.innerHTML = '';
      SECTIONS.forEach((sec) => {
        const vis = sec.items.filter((it) => editing || !isPassive(it) || showPassive);
        if (!vis.length) return;
        const block = document.createElement('div'); block.className = 'section-block';
        const h = document.createElement('div'); h.className = 'section-title'; h.textContent = sec.title; block.appendChild(h);
        const grid = document.createElement('div'); grid.className = 'grid';
        vis.forEach((it) => {
          const passive = isPassive(it);
          const a = document.createElement('a');
          a.className = 'card' + (passive ? ' passive' : '');
          a.href = it.url; a.style.setProperty('--c', sec.accent);
          const right = editing
            ? `<button class="statusbtn ${passive ? '' : 'is-active'}" data-url="${it.url}">${passive ? 'Passiv' : 'Aktiv'}</button>`
            : '<span class="arrow">›</span>';
          a.innerHTML = `<span class="ic">${svg(it.icon)}</span>` +
            `<span class="body"><span class="name">${it.name}</span><span class="desc">${it.desc}</span></span>` + right;
          grid.appendChild(a);
        });
        block.appendChild(grid); root.appendChild(block);
      });
      renderControls();
    }

    function renderControls() {
      const pc = passiveCount();
      let html = '';
      if (pc > 0) html += `<button class="ctrl ${showPassive ? 'on' : ''}" id="btn-passive">${showPassive ? 'Skjul passive' : 'Vis passive (' + pc + ')'}</button>`;
      html += `<button class="ctrl ${editing ? 'on' : ''}" id="btn-edit">${editing ? '✓ Færdig' : 'Rediger'}</button>`;
      controls.innerHTML = html;
      editHint.hidden = !editing;
      document.body.classList.toggle('editing', editing);
      const bp = document.getElementById('btn-passive');
      if (bp) bp.onclick = () => { showPassive = !showPassive; LS.setItem('bh_showpassive', showPassive ? '1' : '0'); render(); };
      document.getElementById('btn-edit').onclick = () => { editing = !editing; render(); };
    }

    // toggle a project's status / block navigation while editing
    root.addEventListener('click', (e) => {
      const btn = e.target.closest('.statusbtn');
      if (btn) {
        e.preventDefault(); e.stopPropagation();
        const u = btn.dataset.url;
        status[u] = (status[u] === 'passive') ? 'active' : 'passive';
        saveStatus(); render();
        return;
      }
      if (editing && e.target.closest('.card')) e.preventDefault();
    });

    render();
    document.getElementById('count').textContent = SECTIONS.reduce((n, s) => n + s.items.length, 0);

    // register service worker so the hub is installable + works offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
